<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaccard KO similarity</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #d0d0d0;
    --head-bg: #f0f0f0;
    --row-alt: #fafafa;
    --accent: #2563eb;
    --error: #b3261e;
    --donor: #2e7d32;
    --acceptor: #b9560c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #e8e8e8;
      --muted: #a0a0a0;
      --border: #3a3a3a;
      --head-bg: #262626;
      --row-alt: #202020;
      --accent: #6ea8fe;
      --error: #ff6b60;
      --donor: #66bb6a;
      --acceptor: #ffa726;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 16px; }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
  }
  #controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  #controls input[type="number"] { width: 90px; }
  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { min-height: 20px; margin-bottom: 12px; }
  #tabs, #viewToggle { display: flex; gap: 4px; margin-bottom: 8px; }
  #tabs[hidden], #viewToggle[hidden] { display: none; }
  #tabs button, #viewToggle button {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px 4px 0 0;
  }
  #tabs button.active, #viewToggle button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #status.error { color: var(--error); }
  #tableWrap { overflow-x: auto; border: 1px solid var(--border); max-width: 100%; }
  table { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: right; }
  th.text-col, td.text-col { text-align: left; }
  /* Tree mode draws the whole cladogram as one SVG sized to the space available, so it
     never fights table row heights (a <table> can't go below 1px/row, which left no
     content box at all for the old per-row SVG slices). */
  #treeWrap { border: 1px solid var(--border); overflow: hidden; max-width: 100%; }
  #treeWrap[hidden] { display: none; }
  #treeSvg { display: block; }
  .tree-line { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tree-line-match { stroke: var(--error); stroke-width: 2; vector-effect: non-scaling-stroke; }
  /* Per-group similarity strip: colour density (quantised to 0.25) instead of numbers. */
  .cell-donor { fill: var(--donor); }
  .cell-acceptor { fill: var(--acceptor); }
  #treeHead { position: relative; height: 34px; border-bottom: 1px solid var(--border); overflow: hidden; }
  #treeHead .col-label {
    position: absolute;
    top: 0;
    bottom: 0;
    font-size: 10px;
    line-height: 1.15;
    color: var(--muted);
    padding: 2px 3px;
    overflow: hidden;
    border-left: 1px solid var(--border);
  }
  #treeHead .tree-title { position: absolute; left: 4px; top: 2px; font-size: 11px; color: var(--muted); }
  #treeLegend { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); position: absolute; left: 4px; bottom: 2px; }
  #treeLegend .sw { width: 14px; height: 9px; background: var(--muted); display: inline-block; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--head-bg);
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--accent); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  #selftest-result { display: none; }
  #treeTooltip {
    position: fixed;
    z-index: 10;
    background: var(--head-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    pointer-events: none;
    max-width: 260px;
    white-space: normal;
  }
  #treeTooltip[hidden] { display: none; }
  #treeTooltip.pinned { pointer-events: auto; }
  #treeTooltip a { color: var(--accent); }
  #treeTooltip .tt-close { cursor: pointer; float: right; margin-left: 10px; color: var(--muted); }
</style>
</head>
<body>
<h1>Jaccard KO similarity</h1>
<p class="hint">KofamScan の *.kolist_gene.tsv を選ぶと、埋め込み済みの genome_ko_matrix / KO config に対する Jaccard 類似度を計算します。</p>

<div id="controls">
  <label>Query KofamScan file (*.kolist_gene.tsv)
    <input type="file" id="queryFile" accept=".tsv,.txt">
  </label>
  <label>Min similarity (0.0–1.0)
    <input type="number" id="minSimilarity" value="0" min="0" max="1" step="0.01">
  </label>
  <button id="runBtn" disabled>Run</button>
  <button id="downloadBtn" disabled>Download TSV</button>
  <button id="clearBtn">Clear</button>
</div>

<div id="status"></div>

<div id="viewToggle" hidden>
  <button id="viewList" class="active" data-view="list">List</button>
  <button id="viewTree" data-view="tree">Tree</button>
</div>

<div id="tabs" hidden>
  <button id="tabDonor" class="active" data-role="donor">Electron Donor</button>
  <button id="tabAcceptor" data-role="acceptor">Electron Acceptor</button>
</div>

<div id="tableWrap">
  <table id="resultsTable">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div id="treeWrap" hidden></div>

<div id="treeTooltip" hidden></div>

<div id="selftest-result"></div>

    var big = small === setA ? setB : setA;

    small.forEach(function (x) { if (big.has(x)) intersection++; });
    var union = setA.size + setB.size - intersection;
    var similarity = union ? intersection / union : 0;
    return { similarity: similarity, intersection: intersection, union: union };
  }

  function restrictToGroup(set, groupSet) {
    var result = new Set();
    set.forEach(function (x) { if (groupSet.has(x)) result.add(x); });

  }

  // Mirrors read_query_kos() in scripts/jaccard_similarity.py.
  function parseQueryKos(text) {
    var kos = new Set();
    var lines = text.split(/\r\n|\r|\n/);
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    if (lines.length === 0) return kos;
    var first = lines[0].split("\t");
    if (!(first.length && first[0] === "KO")) {
      if (first.length && first[0]) kos.add(first[0]);
    }
    for (var i = 1; i < lines.length; i++) {

    }
    return kos;
  }

  function run(queryKos, payload) {

    });

      var overall = jaccard(queryRestricted, presentSet);
      var groupScores = groupSets.map(function (gs) {

      });

      return { rows: flattened, matrix: matrix };
    } else {
      var filteredResults = filterByMinSimilarity(results, minSimilarity);
      var metaLabels = payload.genomeInfoLabels || [];
      var labels = ["genome_id"].concat(metaLabels, ["similarity"], groupIndices.map(function (i) { return payload.groups[i].functionalGroup; }));
      var rows = filteredResults.map(function (r) {
        var row = [r.id].concat(metaValues(payload.genomeInfo, metaLabels, r.id), [r.similarity]);
        groupIndices.forEach(function (i) { row.push(r.groupScores[i].similarity); });
        return row;
      });
      var floatStart = 1 + metaLabels.length;
      var floatCols = new Set();
      for (var c = floatStart; c < labels.length; c++) floatCols.add(c);

      treeWrap.hidden = true;
      treeWrap.innerHTML = "";
      tableWrap.hidden = false;
      renderTable(labels, rows, floatCols, {});
    }

    return null;
  }

  // Size the tree to the space left on screen so the whole thing fits with no vertical
  // scrolling. The SVG's viewBox is `rowCount` tall, so it simply scales into whatever
  // height it gets — no per-row layout involved.
  var TREE_FIT_MARGIN_PX = 16;

  function treeFitSize(treeWrap, rowCount) {
    var top = treeWrap.getBoundingClientRect().top;
    var head = treeWrap.querySelector("#treeHead");
    var headH = head ? head.getBoundingClientRect().height : 0;
    var available = window.innerHeight - top - headH - TREE_FIT_MARGIN_PX;
    if (!(available > 80)) available = 80;
    var width = treeWrap.clientWidth || treeWrap.getBoundingClientRect().width || 600;
    if (width < 200) width = 200;
    return { width: width, height: rowCount ? available : 0 };
  }

  function renderTable(labels, rows, floatCols, opts) {
    opts = opts || {};
    var onHeaderClick = opts.onHeaderClick || null;
    var preserveOrder = !!opts.preserveOrder;
    var svgCols = opts.svgCols || new Set();
    var table = document.getElementById("resultsTable");
    var theadRow = table.querySelector("thead tr");
    var tbody = table.querySelector("tbody");
    theadRow.innerHTML = "";
    tbody.innerHTML = "";

    var defaultSortCol = floatCols.size ? Math.min.apply(null, Array.from(floatCols)) : 0;
    var sortState = { col: defaultSortCol, dir: -1 };

    function draw() {
      var sorted = preserveOrder
        ? rows
        : rows.slice().sort(function (a, b) {
            var col = sortState.col;
            if (!floatCols.has(col)) return sortState.dir * String(a[col]).localeCompare(String(b[col]));
            return sortState.dir * (a[col] - b[col]);
          });
      tbody.innerHTML = "";
      sorted.forEach(function (row) {
        var tr = document.createElement("tr");
        row.forEach(function (value, i) {
          var td = document.createElement("td");
          if (!floatCols.has(i)) td.classList.add("text-col");
          if (svgCols.has(i)) {
            td.classList.add("tree-col");
            td.innerHTML = value;
          } else {
            td.textContent = formatCell(i, value, floatCols, 3);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    labels.forEach(function (label, i) {
      var th = document.createElement("th");
      if (!floatCols.has(i)) th.classList.add("text-col");
      th.textContent = label;
      th.addEventListener("click", function () {
        if (onHeaderClick && onHeaderClick(i)) return;
        sortState.dir = sortState.col === i ? -sortState.dir : -1;
        sortState.col = i;
        draw();
      });
      theadRow.appendChild(th);
    });

    draw();
  }

  function main() {
    var status = document.getElementById("status");
    var payload;
    try {
      payload = JSON.parse(document.getElementById("jaccard-data").textContent);
    } catch (err) {
      status.textContent = "データが埋め込まれていません。scripts/build_jaccard_html.py で生成したHTMLファイルを開いてください（このテンプレートを直接開いていませんか？）。";
      status.className = "error";
      return;
    }
    var queryFileInput = document.getElementById("queryFile");
    var minSimilarityInput = document.getElementById("minSimilarity");
    var runBtn = document.getElementById("runBtn");
    var downloadBtn = document.getElementById("downloadBtn");
    var clearBtn = document.getElementById("clearBtn");
    var tabDonor = document.getElementById("tabDonor");
    var tabAcceptor = document.getElementById("tabAcceptor");
    var tabs = document.getElementById("tabs");
    var viewList = document.getElementById("viewList");
    var viewTree = document.getElementById("viewTree");
    var viewToggle = document.getElementById("viewToggle");

    var queryText = null;
    var lastLabels = null;
    var lastRows = null;
    var lastFloatCols = null;
    var lastResults = null;
    var lastTreeRows = null;
    var lastTree = null;
    var lastMinSimilarity = 0;
    var currentRole = "donor";
    var currentView = "list";

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? "error" : "";
    }

    function doRender() {
      lastTree = renderForRole(payload, lastResults, currentRole, currentView, lastMinSimilarity, exitTreeAndRerender);
      lastTreeRows = lastTree ? lastTree.rows : null;
    }

    function runAnalysis() {
      if (queryText === null) return;
      var minSimilarity = parseFloat(minSimilarityInput.value);
      if (isNaN(minSimilarity) || minSimilarity < 0) minSimilarity = 0;
      if (minSimilarity > 1) minSimilarity = 1;
      try {
        var queryKos = parseQueryKos(queryText);
        var results = run(queryKos, payload);
        var filteredResults = filterByMinSimilarity(results, minSimilarity);
        var metaLabels = payload.genomeInfoLabels || [];
        lastResults = results;
        lastMinSimilarity = minSimilarity;
        lastLabels = headerLabels(payload.groups, metaLabels);
        lastRows = toRows(filteredResults, payload.genomeInfo, metaLabels);
        lastFloatCols = floatColumns(payload.groups.length, metaLabels.length);
        doRender();
        tabs.hidden = false;
        viewToggle.hidden = false;
        runBtn.disabled = false;
        downloadBtn.disabled = false;
        setStatus(filteredResults.length + " genomes (query KOs: " + queryKos.size + ")");
      } catch (err) {
        downloadBtn.disabled = true;
        setStatus("計算中にエラーが発生しました: " + err.message, true);
      }
    }

    function switchTab(role) {
      currentRole = role;
      tabDonor.classList.toggle("active", role === "donor");
      tabAcceptor.classList.toggle("active", role === "acceptor");
      if (lastResults) doRender();
    }

    function switchView(view) {
      currentView = view;
      if (view === "list") unpinTooltip();
      viewList.classList.toggle("active", view === "list");
      viewTree.classList.toggle("active", view === "tree");
      if (lastResults) doRender();
    }

    function exitTreeAndRerender() {
      switchView("list");
    }

    // --- Tree hover/click tooltip: report.html's "hover shows the taxon at that rank,
    // its genome count; pin it to open NCBI Taxonomy" behaviour, adapted for this
    // page's per-row SVGs (report.html hit-tests a canvas by x-position within the tree
    // area's rank columns; here we do the same against whichever tree <td> the cursor
    // is over).
    var treeTooltip = document.getElementById("treeTooltip");
    var treeWrap = document.getElementById("treeWrap");
    var pinnedHit = null; // the hit being shown while pinned, else null

    // Hit-test against the single tree SVG. Left of the similarity strip, x picks a rank
    // column (report.html hit-tests its canvas the same way); over the strip, x picks a
    // functional-group column instead — the strip only shows colour, so hovering is the
    // only way back to the exact number.
    function findTreeHit(e) {
      var svg = document.getElementById("treeSvg");
      if (!svg || !lastTreeRows || !lastTreeRows.length) return null;
      var rect = svg.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) return null;

      var rowIndex = Math.floor((y / rect.height) * lastTreeRows.length);
      if (rowIndex < 0) rowIndex = 0;
      if (rowIndex > lastTreeRows.length - 1) rowIndex = lastTreeRows.length - 1;

      var labels = (lastTree && lastTree.matrix && lastTree.matrix.labels) || [];
      var viewW = svg.viewBox.baseVal.width || rect.width;
      var scale = rect.width / viewW;
      var layout = treeLayout(viewW, labels.length);

      if (labels.length && x >= layout.treeW * scale) {
        var colIndex = Math.floor((x - layout.treeW * scale) / Math.max(layout.colW * scale, 1));
        if (colIndex < 0) colIndex = 0;
        if (colIndex > labels.length - 1) colIndex = labels.length - 1;
        return { kind: "cell", rowIndex: rowIndex, colIndex: colIndex };
      }

      // The rank columns occupy everything left of the leaf-tick strip.
      var treeSpan = (layout.treeW - TREE_LEAF_W) * scale;
      var rankIndex = Math.floor((x / Math.max(treeSpan, 1)) * RANK_COUNT);
      if (rankIndex < 0) rankIndex = 0;
      if (rankIndex > RANK_COUNT - 1) rankIndex = RANK_COUNT - 1;
      return { kind: "rank", rowIndex: rowIndex, rankIndex: rankIndex };
    }

    function nodeAtHit(hit) {
      var row = lastTreeRows[hit.rowIndex];
      return row ? row.ancestors[hit.rankIndex] : null;
    }

    function sameHit(a, b) {
      return !!a && !!b && a.kind === b.kind && a.rowIndex === b.rowIndex &&
        a.rankIndex === b.rankIndex && a.colIndex === b.colIndex;
    }

    function tooltipHtml(hit, pinned) {
      var close = pinned ? '<span class="tt-close" title="close">×</span>' : "";
      var row = lastTreeRows[hit.rowIndex];
      if (!row) return null;

      if (hit.kind === "cell") {
        var matrix = lastTree && lastTree.matrix;
        if (!matrix) return null;
        var values = (matrix.valuesById && matrix.valuesById[row.genomeId]) || [];
        var value = values[hit.colIndex];
        var species = row.ancestors[RANK_COUNT - 1].name || "(unclassified)";
        return close +
          "<strong>" + escapeHtml(matrix.labels[hit.colIndex]) + "</strong>" +
          "<br>similarity: " + (typeof value === "number" ? value.toFixed(3) : "-") +
          "<br>" + escapeHtml(row.genomeId) + " (" + escapeHtml(species) + ")";
      }

      var node = nodeAtHit(hit);
      if (!node) return null;
      var rankName = (payload.rankNames && payload.rankNames[hit.rankIndex]) || ("rank " + hit.rankIndex);
      var name = node.name || "(unclassified)";
      var count = node.lastRow - node.firstRow + 1;
      var html = close +
        "<strong>" + escapeHtml(rankName) + ":</strong> " + escapeHtml(name) +
        "<br>" + count + " genome" + (count === 1 ? "" : "s");
      if (pinned && node.taxid) {
        html +=
          '<br><a href="https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=' +
          encodeURIComponent(node.taxid) +
          '" target="_blank" rel="noopener">NCBI Taxonomy</a>';
      }
      return html;
    }

    function positionTooltip(x, y) {
      treeTooltip.style.left = (x + 14) + "px";
      treeTooltip.style.top = (y + 14) + "px";
    }

    function unpinTooltip() {
      pinnedHit = null;
      treeTooltip.hidden = true;
      treeTooltip.classList.remove("pinned");
    }

    treeWrap.addEventListener("mousemove", function (e) {
      if (pinnedHit) return;
      var hit = findTreeHit(e);
      var html = hit && tooltipHtml(hit, false);
      if (!html) { treeTooltip.hidden = true; return; }
      treeTooltip.innerHTML = html;
      positionTooltip(e.clientX, e.clientY);
      treeTooltip.hidden = false;
    });

    treeWrap.addEventListener("mouseleave", function () {
      if (!pinnedHit) treeTooltip.hidden = true;
    });

    treeWrap.addEventListener("click", function (e) {
      var hit = findTreeHit(e);
      if (!hit) return;
      if (sameHit(pinnedHit, hit)) {
        unpinTooltip();
        return;
      }
      var html = tooltipHtml(hit, true);
      if (!html) return;
      pinnedHit = hit;
      treeTooltip.innerHTML = html;
      treeTooltip.classList.add("pinned");
      positionTooltip(e.clientX, e.clientY);
      treeTooltip.hidden = false;
      treeTooltip.querySelector(".tt-close").addEventListener("click", function (ev) {
        ev.stopPropagation();
        unpinTooltip();
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && pinnedHit) unpinTooltip();
    });

    tabDonor.addEventListener("click", function () { switchTab("donor"); });
    tabAcceptor.addEventListener("click", function () { switchTab("acceptor"); });
    viewList.addEventListener("click", function () { switchView("list"); });
    viewTree.addEventListener("click", function () { switchView("tree"); });

    window.addEventListener("resize", function () {
      // The tree is sized to the viewport, so re-render it when the viewport changes.
      if (currentView === "tree" && lastResults) doRender();
    });

    queryFileInput.addEventListener("change", function () {
      var file = queryFileInput.files[0];
      if (!file) { queryText = null; runBtn.disabled = true; downloadBtn.disabled = true; return; }
      var reader = new FileReader();
      reader.onload = function () {
        queryText = reader.result;
        runBtn.disabled = false;
        downloadBtn.disabled = true;
        setStatus("読み込み完了: " + file.name + "（Run を押してください）");
      };
      reader.onerror = function () {
        queryText = null;
        runBtn.disabled = true;
        downloadBtn.disabled = true;
        setStatus("ファイルの読み込みに失敗しました: " + file.name, true);
      };
      reader.readAsText(file);
    });

    runBtn.addEventListener("click", runAnalysis);

    downloadBtn.addEventListener("click", function () {
      if (!lastRows) return;
      var tsv = buildTsv(lastLabels, lastRows, lastFloatCols);
      var blob = new Blob([tsv], { type: "text/tab-separated-values" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "jaccard_similarity.tsv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener("click", function () {
      queryFileInput.value = "";
      queryText = null;
      lastResults = null;
      lastLabels = null;
      lastRows = null;
      lastFloatCols = null;
      lastTreeRows = null;
      lastTree = null;
      lastMinSimilarity = 0;
      unpinTooltip();
      runBtn.disabled = true;
      downloadBtn.disabled = true;
      tabs.hidden = true;
      viewToggle.hidden = true;
      currentView = "list";
      viewList.classList.add("active");
      viewTree.classList.remove("active");
      document.querySelector("#resultsTable thead tr").innerHTML = "";
      document.querySelector("#resultsTable tbody").innerHTML = "";
      treeWrap.innerHTML = "";
      treeWrap.hidden = true;
      document.getElementById("tableWrap").hidden = false;
      setStatus("");
    });
  }

  function selfTest() {
    var payload = {
      koColumns: ["K00001", "K00002"],
      groups: [
        { role: "donor", functionalGroup: "Group A", kos: [0] },
        { role: "donor", functionalGroup: "Group B", kos: [1] },
        { role: "acceptor", functionalGroup: "Group C", kos: [0] }
      ],
      genomes: [
        { id: "GCF_self", present: [0, 1] },
        { id: "GCF_partial", present: [0] },
        { id: "GCF_none", present: [] }
      ]
    };
    var queryKos = new Set(["K00001", "K00002"]);
    var failures = [];

    function expect(cond, message) { if (!cond) failures.push(message); }
    function close(a, b) { return Math.abs(a - b) < 1e-9; }

    var results = run(queryKos, payload);
    expect(results.length === 3, "expected 3 genomes, got " + results.length);

    var self_ = results.filter(function (r) { return r.id === "GCF_self"; })[0];
    expect(self_ && close(self_.similarity, 1) && self_.intersection === 2 && self_.union === 2, "GCF_self overall mismatch");
    expect(
      self_ && self_.groupScores.every(function (g) { return close(g.similarity, 1) && g.intersection === 1 && g.union === 1; }),
      "GCF_self group scores mismatch"
    );

    var partial = results.filter(function (r) { return r.id === "GCF_partial"; })[0];
    expect(partial && close(partial.similarity, 0.5) && partial.intersection === 1 && partial.union === 2, "GCF_partial overall mismatch");
    expect(
      partial &&
        close(partial.groupScores[0].similarity, 1) && partial.groupScores[0].intersection === 1 && partial.groupScores[0].union === 1 &&
        close(partial.groupScores[1].similarity, 0) && partial.groupScores[1].intersection === 0 && partial.groupScores[1].union === 1 &&
        close(partial.groupScores[2].similarity, 1) && partial.groupScores[2].intersection === 1 && partial.groupScores[2].union === 1,
      "GCF_partial group scores mismatch"
    );

    var none = results.filter(function (r) { return r.id === "GCF_none"; })[0];
    expect(none && close(none.similarity, 0) && none.intersection === 0 && none.union === 2, "GCF_none overall mismatch");

    var labels = headerLabels(payload.groups);
    var expectedHeader = [
      "genome_id", "similarity", "intersection", "union",
      "donor:Group A:jaccard", "donor:Group A:intersection", "donor:Group A:union",
      "donor:Group B:jaccard", "donor:Group B:intersection", "donor:Group B:union",
      "acceptor:Group C:jaccard", "acceptor:Group C:intersection", "acceptor:Group C:union"
    ];
    expect(labels.join(",") === expectedHeader.join(","), "header labels mismatch: " + labels.join(","));

    var kos = parseQueryKos("KO\tgene\nK00001\tWP_1\nK00002\tWP_2\n");
    expect(kos.size === 2 && kos.has("K00001") && kos.has("K00002"), "parseQueryKos mismatch");

    var thresholded = filterByMinSimilarity(run(queryKos, payload), 0.6);
    expect(
      thresholded.length === 1 && thresholded[0].id === "GCF_self",
      "minSimilarity threshold filtering mismatch: " + thresholded.map(function (r) { return r.id; }).join(",")
    );

    var donorIndices = groupIndicesForRole(payload.groups, "donor");
    var acceptorIndices = groupIndicesForRole(payload.groups, "acceptor");
    expect(
      donorIndices.map(function (i) { return payload.groups[i].functionalGroup; }).join(",") === "Group A,Group B",
      "donor group filtering mismatch"
    );
    expect(
      acceptorIndices.map(function (i) { return payload.groups[i].functionalGroup; }).join(",") === "Group C",
      "acceptor group filtering mismatch"
    );

    expect(formatCell(1, 0.123456, new Set([1]), 3) === "0.123", "formatCell 3-decimal rounding mismatch");
    expect(formatCell(1, 0.123456, new Set([1])) === "0.123456", "formatCell default 6-decimal mismatch");

    var metaLabels = ["strain"];
    var genomeInfo = { GCF_self: ["Strain X"] };

    var labelsWithMeta = headerLabels(payload.groups, metaLabels);
    expect(
      labelsWithMeta[0] === "genome_id" && labelsWithMeta[1] === "strain" && labelsWithMeta[2] === "similarity",
      "headerLabels metadata insertion mismatch: " + labelsWithMeta.join(",")
    );

    var rowsWithMeta = toRows(results, genomeInfo, metaLabels);
    var selfRowWithMeta = rowsWithMeta.filter(function (row) { return row[0] === "GCF_self"; })[0];
    var noneRowWithMeta = rowsWithMeta.filter(function (row) { return row[0] === "GCF_none"; })[0];
    expect(selfRowWithMeta[1] === "Strain X", "toRows metadata value mismatch for GCF_self: " + selfRowWithMeta[1]);
    expect(noneRowWithMeta[1] === "", "toRows metadata fallback mismatch for GCF_none: " + JSON.stringify(noneRowWithMeta[1]));
    expect(selfRowWithMeta[2] === self_.similarity, "toRows similarity shifted incorrectly with metadata present");

    var floatColsWithMeta = floatColumns(payload.groups.length, metaLabels.length);
    expect(
      floatColsWithMeta.has(2) && !floatColsWithMeta.has(1) && floatColsWithMeta.has(5) && floatColsWithMeta.has(8) && floatColsWithMeta.has(11),
      "floatColumns offset mismatch with metadata: " + Array.from(floatColsWithMeta).join(",")
    );

    var treeResults = [
      { id: "GCF_a" }, { id: "GCF_b" }, { id: "GCF_c" }, { id: "GCF_missingFamily" }, { id: "GCF_allUnknown" }
    ];
    var treeGenomeRanks = {
      GCF_a: ["Bacteria", "Proteobacteria", "Alpha", "Ord1", "Fam1", "GenusX", "SpeciesX1"],
      GCF_b: ["Bacteria", "Proteobacteria", "Alpha", "Ord1", "Fam1", "GenusX", "SpeciesX2"],
      GCF_c: ["Bacteria", "Proteobacteria", "Beta", "Ord2", "Fam2", "GenusY", "SpeciesY1"],
      GCF_missingFamily: ["Bacteria", "Proteobacteria", "Alpha", "Ord1", "", "GenusZ", "SpeciesZ1"],
      GCF_allUnknown: []
    };
    var treeRoot = buildRankTree(treeResults, treeGenomeRanks);
    var flattened = flattenRankTree(treeRoot);
    var order = flattened.map(function (e) { return e.genomeId; });
    expect(
      order.join(",") === "GCF_a,GCF_b,GCF_missingFamily,GCF_c,GCF_allUnknown",
      "rank tree flatten order mismatch: " + order.join(",")
    );
    expect(
      flattened.every(function (e, i) { return e.index === i; }),
      "rank tree row index mismatch"
    );

    var aEntry = flattened.filter(function (e) { return e.genomeId === "GCF_a"; })[0];
    var mfEntry = flattened.filter(function (e) { return e.genomeId === "GCF_missingFamily"; })[0];
    // GCF_a's phylum ancestor (Proteobacteria) spans all of Bacteria's genomes (rows 0-3).
    expect(
      aEntry.ancestors[1].firstRow === 0 && aEntry.ancestors[1].lastRow === 3,
      "phylum node span mismatch: " + aEntry.ancestors[1].firstRow + ".." + aEntry.ancestors[1].lastRow
    );
    // GCF_missingFamily's family ancestor is the "" (unclassified) placeholder, a
    // singleton span distinct from GCF_a/GCF_b's real "Fam1" family node.
    expect(
      mfEntry.ancestors[4].name === "" && mfEntry.ancestors[4].firstRow === 2 && mfEntry.ancestors[4].lastRow === 2,
      "unclassified family placeholder span mismatch"
    );
    expect(aEntry.ancestors[4].name === "Fam1", "GCF_a should sit under the real Fam1 node, not the placeholder");

    var svgAllPlain = buildTreeSvg(treeRoot, flattened, {}, 600, 400);
    var svgOneMatch = buildTreeSvg(treeRoot, flattened, { GCF_a: true }, 600, 400);
    function countOccurrences(text, needle) {
      return text.split(needle).length - 1;
    }
    expect(svgAllPlain.indexOf("<svg") === 0 && svgAllPlain.indexOf("</svg>") !== -1, "buildTreeSvg should emit an <svg> element");
    expect(
      countOccurrences(svgAllPlain, 'y1="' ) >= flattened.length,
      "buildTreeSvg should draw at least one line per genome"
    );
    expect(countOccurrences(svgAllPlain, "tree-line-match") === 0, "buildTreeSvg with no matches should carry no match class");
    // GCF_a's full ancestor chain (7 ranks: domain..species) turns red, plus its own
    // leaf tick — the whole domain-to-species path, not just the tick.
    expect(
      countOccurrences(svgOneMatch, "tree-line-match") === RANK_COUNT + 1,
      "buildTreeSvg should redden the matched genome's whole path (" + (RANK_COUNT + 1) + " lines), got " +
        countOccurrences(svgOneMatch, "tree-line-match")
    );
    // Calling buildTreeSvg again with NO matches must not leak red from the previous
    // call (guards against mutating shared node objects instead of using a local Set).
    var svgAgainPlain = buildTreeSvg(treeRoot, flattened, {}, 600, 400);
    expect(countOccurrences(svgAgainPlain, "tree-line-match") === 0, "buildTreeSvg must not retain match state across calls");
    expect(buildTreeSvg(treeRoot, [], {}, 600, 400) === "", "buildTreeSvg with no rows should render nothing");

    // Similarity strip: 0.25-step quantisation drives the cell opacity.
    expect(quantizeLevel(0) === 0, "quantizeLevel(0) should be 0");
    expect(quantizeLevel(0.1) === 0, "quantizeLevel(0.1) should round down to 0");
    expect(quantizeLevel(0.13) === 0.25, "quantizeLevel(0.13) should round up to 0.25");
    expect(quantizeLevel(0.5) === 0.5, "quantizeLevel(0.5) should be 0.5");
    expect(quantizeLevel(0.9) === 1, "quantizeLevel(0.9) should round up to 1");
    expect(quantizeLevel(5) === 1, "quantizeLevel should clamp above 1");

    var stripMatrix = {
      role: "donor",
      labels: ["Group A", "Group B"],
      // GCF_a: one visible cell (0.9 -> 1) and one that quantises to 0 (0.1).
      valuesById: { GCF_a: [0.9, 0.1], GCF_b: [0.5, 0.5] }
    };
    var svgStrip = buildTreeSvg(treeRoot, flattened, {}, 600, 400, stripMatrix);
    expect(countOccurrences(svgStrip, "<rect") === 3, "strip should draw one rect per non-zero cell, got " + countOccurrences(svgStrip, "<rect"));
    expect(countOccurrences(svgStrip, "cell-donor") === 3, "strip cells should carry the donor class");
    expect(svgStrip.indexOf('fill-opacity="1"') !== -1, "0.9 should render at full opacity");
    expect(svgStrip.indexOf('fill-opacity="0.5"') !== -1, "0.5 should render at half opacity");

    var svgStripAcceptor = buildTreeSvg(treeRoot, flattened, {}, 600, 400, {
      role: "acceptor", labels: ["Group C"], valuesById: { GCF_a: [1] }
    });
    expect(countOccurrences(svgStripAcceptor, "cell-acceptor") === 1, "acceptor strip cells should carry the acceptor class");

    var outcome = failures.length === 0 ? "pass" : "fail: " + failures.join("; ");
    document.documentElement.setAttribute("data-selftest", outcome);
    document.getElementById("selftest-result").textContent = outcome;
  }

  if (new URLSearchParams(location.search).get("selftest") === "1") {
    selfTest();
  } else {
    main();
  }
})();
</script>
